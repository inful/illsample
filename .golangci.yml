version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - nilerr
    - nolintlint
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-equal
        - name: superfluous-else
        # The parseV1/parseV2 internal helpers and the public
        # ParseV1/ParseV2 entry points differ only by case, which
        # this rule flags. The naming is intentional (internal
        # helper vs. public entry point) and renaming the internals
        # would just add noise.
        - name: confusing-naming
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/inful/illsample
